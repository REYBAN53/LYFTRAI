[project]
name = "lyftr-chat-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    # LiteLLM's own TypedDicts trigger this pydantic warning on import; not actionable here.
    "ignore:.*ReadOnly. qualifier:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
