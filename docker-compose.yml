name: lyftr-chat

services:
  backend:
    build:
      context: ./backend
      target: runtime
    image: lyftr-chat-backend
    env_file:
      - path: .env
        required: false
    environment:
      # Pinned inside the container: the SQLite file lives on the named volume below.
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
    volumes:
      - chat-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    image: lyftr-chat-frontend
    environment:
      # The browser calls the backend directly, so this is the host-visible URL.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chat-data:
