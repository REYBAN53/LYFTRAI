# Render Blueprint: deploys both tiers from this repo (Dashboard -> New -> Blueprint).
# Secrets are declared with `sync: false`; Render asks for them on first deploy and never
# reads them from the repository.
services:
  - type: web
    name: lyftr-chat-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS          # comma-separated, at least 2 keys
        sync: false
      - key: ALLOWED_ORIGINS       # e.g. https://lyftr-chat-frontend.onrender.com
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: LLM_MODEL
        value: gemini/gemini-flash-lite-latest

  - type: web
    name: lyftr-chat-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL     # e.g. https://lyftr-chat-backend.onrender.com
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /env-config.js
        name: Cache-Control
        value: no-store
