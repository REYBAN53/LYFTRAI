# Render Blueprint: deploys both tiers from this repo (Dashboard -> New -> Blueprint).
# Secrets are declared with `sync: false`; Render asks for them when the Blueprint is created
# and never reads them from the repository. All paths below are relative to the repo root.
services:
  # FastAPI + LiteLLM backend, built from backend/Dockerfile (final "runtime" stage).
  - type: web
    name: lyftr-chat-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS          # comma-separated, at least 2 keys: key1,key2
        sync: false
      - key: ALLOWED_ORIGINS       # the frontend URL, e.g. https://lyftr-chat-frontend.onrender.com
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: LLM_MODEL
        value: gemini/gemini-flash-lite-latest

  # React static site (free). The backend URL is baked in at build time.
  - type: web
    name: lyftr-chat-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL     # the backend URL, e.g. https://lyftr-chat-backend.onrender.com
        sync: false
      - key: NODE_VERSION
        value: "22"
